<script type="module">

    import { Engine } from "./engine.js";

    const engine = new Engine();

    window.addEventListener("load", async () => {

        document
            .getElementById("loading")
            .style.display = "none";

        try {
            const startPromise = engine.start();
            const timeoutPromise = new Promise((_, reject) => 
                setTimeout(() => reject(new Error("Startup timeout after 5 seconds")), 5000)
            );
            await Promise.race([startPromise, timeoutPromise]);
        } catch (error) {
            console.error("Engine startup failed:", error);
            document
                .getElementById("loading")
                .style.display = "flex";
            document
                .querySelector("#loading .status")
                .textContent =
                    `Engine startup failed: ${error instanceof Error ? error.message : String(error)}`;
        }

    });

</script>
